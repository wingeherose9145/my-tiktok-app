name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/ || true
          
      - name: Capacitor Setup
        run: |
          npm install --force
          npx cap add android
          
          # MainActivity 注入：精准保留核心配置
          python3 -c "
          import os
          path = 'android/app/src/main/java/com/mytiktok/app/MainActivity.java'
          with open(path, 'r') as f: content = f.read()
          imports = 'import android.os.Bundle;\nimport android.webkit.WebSettings;'
          content = content.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\n' + imports)
          logic = '''
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // 硬件加速防止视频黑屏/卡顿
                  getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED);
                  
                  // 核心修复：强开 WebView 加载内容访问权限（解决黑屏关键）
                  WebSettings settings = this.bridge.getWebView().getSettings();
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  // 移除所有对 StatusBar/FullScreen 的 Java 级操作，交给 Capacitor 处理
              }
          '''
          content = content.replace('public class MainActivity extends BridgeActivity {}', 'public class MainActivity extends BridgeActivity {' + logic + '}')
          with open(path, 'w') as f: f.write(content)
          "

          # Manifest 注入：媒体读取权限
          python3 -c "
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: c = f.read()
          perms = '\\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\\n    <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />\\n'
          c = c.replace('</manifest>', perms + '</manifest>')
          if 'requestLegacyExternalStorage' not in c:
              c = c.replace('<application', '<application android:requestLegacyExternalStorage=\"true\"')
          with open(p, 'w') as f: f.write(c)
          "
          npx cap sync android

      - name: Build APK
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-UI-Fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
