name: Build Android APK

on: [push] # 只要你修改代码，GitHub 就会自动开始打包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 安装依赖
        run: npm install

      - name: 设置 Java 环境
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 初始化 Android 项目
        run: |
          npx cap add android
          npx cap copy

      - name: 打包 APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v3
        with:
          name: my-tiktok-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
