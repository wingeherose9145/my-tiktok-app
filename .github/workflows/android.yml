name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 解决 Node.js 20 弃用警告

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          # 确保根目录有这三个文件，如果没有请检查文件名大小写
          cp index.html style.css script.js www/
          
      - name: Capacitor Android Setup
        run: |
          # 1. 安装依赖并添加安卓平台
          npm install --force
          npx cap add android
          
          # 2. 注入增强型 MainActivity.java
          # 增加自动跳转“所有文件访问权限”设置页面的逻辑
          mkdir -p android/app/src/main/java/com/mytiktok/app/
          cat <<'EOF' > android/app/src/main/java/com/mytiktok/app/MainActivity.java
          package com.mytiktok.app;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // 设置沉浸式全屏
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | 
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                      getWindow().setStatusBarColor(Color.TRANSPARENT);
                  }

                  // 核心修复：针对 Android 11+ 申请永久文件访问权限
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      }
                  }
              }
          }
          EOF

          # 3. 使用 Python 注入 AndroidManifest 权限声明
          # 包含 MANAGE_EXTERNAL_STORAGE 以获得永久访问权
          python3 -c "
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: c = f.read()
          
          # 添加 tools 命名空间
          if 'xmlns:tools' not in c:
              c = c.replace('<manifest', '<manifest xmlns:tools=\"http://schemas.android.com/tools\"')
          
          # 注入权限
          perms = '''
    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" tools:ignore=\"ScopedStorage\" />
'''
          if '</manifest>' in c:
              c = c.replace('</manifest>', perms + '</manifest>')
          
          with open(p, 'w') as f: f.write(c)
          "
          
          # 4. 同步配置
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTikTok-Fix-v77
          path: android/app/build/outputs/apk/debug/app-debug.apk
