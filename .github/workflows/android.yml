- name: Capacitor Setup
        run: |
          npm install --force
          npx cap add android
          
          # 1. 注入支持权限申请的 MainActivity.java
          mkdir -p android/app/src/main/java/com/mytiktok/app/
          cat <<'EOF' > android/app/src/main/java/com/mytiktok/app/MainActivity.java
          package com.mytiktok.app;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // 全屏沉浸式
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                      getWindow().setStatusBarColor(Color.TRANSPARENT);
                  }

                  // 核心：申请永久文件访问权限 (针对 Android 11+)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      }
                  }
              }
          }
          EOF

          # 2. 用 Python 注入 MANAGE 权限并声明 tools 命名空间
          python3 -c "
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: c = f.read()
          # 注入命名空间和权限
          if 'xmlns:tools' not in c:
              c = c.replace('<manifest', '<manifest xmlns:tools=\"http://schemas.android.com/tools\"')
          
          perms = '''
    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" tools:ignore=\"ScopedStorage\" />
'''
          c = c.replace('</manifest>', perms + '</manifest>')
          with open(p, 'w') as f: f.write(c)
          "
          
          npx cap sync android
