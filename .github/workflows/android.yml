name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
          
      - name: Capacitor Android Setup
        run: |
          npm install --force @capacitor/cli @capacitor/core @capacitor/android @capawesome/capacitor-file-picker
          npx cap add android
          
          # 直接覆盖 MainActivity.java，防止追加错误 (关键修改)
          mkdir -p android/app/src/main/java/com/mytiktok/app/
          cat <<'EOF' > android/app/src/main/java/com/mytiktok/app/MainActivity.java
          package com.mytiktok.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import io.capawesome.capacitor.filepicker.FilePickerPlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  registerPlugin(FilePickerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          # 使用更安全的 python 脚本修改清单文件，避开 sed 的坑
          python3 -c "
          import os
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f: content = f.read()
          perms = '\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />\n'
          content = content.replace('</manifest>', perms + '</manifest>')
          with open(path, 'w') as f: f.write(content)
          "
          
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-fix-build
          path: android/app/build/outputs/apk/debug/app-debug.apk
