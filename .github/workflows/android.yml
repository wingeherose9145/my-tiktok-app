name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/ || true
          
      - name: Capacitor Setup
        run: |
          npm install --force
          npx cap add android
          
          # MainActivity 注入：确保 WebView 权限强开（复刻第84次成功逻辑）
          python3 -c "
          import os
          path = 'android/app/src/main/java/com/mytiktok/app/MainActivity.java'
          with open(path, 'r') as f: content = f.read()
          imports = 'import android.os.Bundle;\nimport android.graphics.Color;\nimport android.view.View;\nimport android.view.WindowManager;'
          content = content.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\n' + imports)
          logic = '''
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                      getWindow().setStatusBarColor(Color.TRANSPARENT);
                  }
                  // 核心：强开 WebView 对搬家后文件的访问权
                  try {
                      this.bridge.getWebView().getSettings().setAllowFileAccess(true);
                      this.bridge.getWebView().getSettings().setAllowContentAccess(true);
                  } catch (Exception e) {}
              }
          '''
          content = content.replace('public class MainActivity extends BridgeActivity {}', 'public class MainActivity extends BridgeActivity {' + logic + '}')
          with open(path, 'w') as f: f.write(content)
          "

          # Manifest 注入：确保存储权限
          python3 -c "
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: c = f.read()
          perms = '\\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\\n    <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />\\n'
          c = c.replace('</manifest>', perms + '</manifest>')
          if 'requestLegacyExternalStorage' not in c:
              c = c.replace('<application', '<application android:requestLegacyExternalStorage=\"true\"')
          with open(p, 'w') as f: f.write(c)
          "
          npx cap sync android

      - name: Build APK
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-CheckFinal
          path: android/app/build/outputs/apk/debug/app-debug.apk
