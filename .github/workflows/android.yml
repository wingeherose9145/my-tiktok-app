name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 彻底清理并准备 www 目录
        run: |
          rm -rf android www node_modules package-lock.json
          mkdir -p www
          # 将核心 H5 文件考入 www 目录
          cp index.html style.css script.js www/ || true
          
      - name: 安装依赖与初始化 (引入零占用插件)
        run: |
          # 强制安装核心包及文件选取插件
          npm install --force @capacitor/cli @capacitor/core @capacitor/android @capawesome/capacitor-file-picker
          npx cap add android
          
          # 1. 注入 MainActivity.java (解决沉浸式全屏和挖孔屏)
          mkdir -p android/app/src/main/java/com/mytiktok/app/
          cat <<EOF > android/app/src/main/java/com/mytiktok/app/MainActivity.java
          package com.mytiktok.app;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                      window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                      window.setStatusBarColor(Color.TRANSPARENT);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = window.getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      window.setAttributes(lp);
                  }
              }
          }
          EOF

          # 2. 注入安卓系统权限 (允许读取外部存储视频)
          # 在 </manifest> 标签前插入读取权限声明
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' android/app/src/main/AndroidManifest.xml
          
          # 3. 同步原生代码
          npx cap sync android

      - name: 执行打包 (Debug APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: my-tiktok-zero-storage-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
